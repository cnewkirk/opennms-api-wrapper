[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opennms-api-wrapper"
version = "0.6.0"
description = "DEPRECATED: renamed to python-opennms"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = 'Richard "Chance" Newkirk', email = "chance.newkirk+github@pm.me" },
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-opennms>=0.6.0",
]

[project.urls]
Homepage = "https://python-opennms.readthedocs.io/en/stable/"
Repository = "https://github.com/cnewkirk/python-opennms"

[tool.setuptools.packages.find]
where = ["."]
include = ["opennms_api_wrapper*"]
