name: Publish legacy shim to PyPI

# One-off, manually triggered publish of the transitional
# opennms-api-wrapper shim (see shim/). The opennms-api-wrapper
# project on PyPI must have a trusted publisher configured for this
# workflow file.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build shim distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build
        working-directory: shim

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shim-dist
          path: shim/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: shim-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
