[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-opennms"
version = "0.6.0"
description = "An unofficial Python 3 client for the OpenNMS REST API (Horizon 35+)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = 'Richard "Chance" Newkirk', email = "chance.newkirk+github@pm.me" },
]
license = { file = "LICENSE" }
keywords = ["opennms", "network-management", "rest", "api", "wrapper", "nms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "responses", "mkdocs-material", "mkdocstrings[python]", "ruff", "mypy", "types-requests"]

[project.urls]
Homepage = "https://python-opennms.readthedocs.io/en/stable/"
Documentation = "https://python-opennms.readthedocs.io/en/stable/"
"API Reference" = "https://python-opennms.readthedocs.io/en/stable/api/"
Repository = "https://github.com/cnewkirk/python-opennms"
"Bug Tracker" = "https://github.com/cnewkirk/python-opennms/issues"
Changelog = "https://github.com/cnewkirk/python-opennms/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["opennms*"]

[tool.setuptools.package-data]
opennms = ["py.typed"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length not enforced on docstrings

[tool.mypy]
python_version = "3.9"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
